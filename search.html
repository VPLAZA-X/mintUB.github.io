<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy</title>
    <script>
        function redirect() {
            const input = document.getElementById('input').value.trim();
            let redirectUrl = '';

            if (input.startsWith('https://')) {
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(input)}`;
            } else {
                const searchUrl = `https://duckduckgo.com/?t=h_&q=${encodeURIComponent(input)}&ia=web`;
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(searchUrl)}`;
            }

            window.location.href = redirectUrl;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                redirect();
            }
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #003300, #66bb6a); /* Black to light green background */
            color: #ffffff; /* White text color */
            padding: 0 2rem;
            margin: 0;
        }

        .nav {
            display: flex;
            gap: 20px; /* Space between the buttons */
            position: absolute; /* Fixed navbar at the top */
            top: 0;
            width: 100%;
            background-color: #000; /* Black navbar */
            z-index: 100;
            justify-content: center; /* Center the navbar */
            padding: 1rem 2rem; /* Padding for the navbar */
        }

        .nav-button {
            background: none; /* No background for buttons */
            color: #fff; /* White text color */
            font-size: 1rem; /* Font size */
            font-weight: 500; /* Font weight */
            padding: 10px 15px; /* Padding around the button */
            border: none; /* Remove border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Change cursor on hover */
            text-decoration: none; /* Remove underline from links */
            transition: color 0.3s ease; /* Smooth color transition */
        }

        .nav-button:hover {
            color: #66cc7a; /* Change text color to light green on hover */
        }

        h2 {
            margin-top: 80px; /* Space below the navbar */
            color: #66bb6a; /* Light green text for the header */
        }

        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #66bb6a; /* Light green border */
            border-radius: 5px;
            margin-top: 20px;
            color: #66bb6a; /* Light green text */
            background: rgba(0, 0, 0, 0.7); /* Dark background for input */
        }

        input::placeholder {
            color: rgba(102, 187, 106, 0.5); /* Light green placeholder text */
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #66bb6a, #66cc7a); /* Button gradient */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #66cc7a; /* Darker green on hover */
        }
    </style>
</head>

<body>
    <nav class="nav">
        <a href="/index" class="nav-button">Home</a>
        <a href="/gms" class="nav-button">Games</a>
        <a href="/apps" class="nav-button">Apps</a>
        <a href="/sports" class="nav-button">Sports</a>
        <a href="/search" class="nav-button">Pro_y</a>
    </nav>

    <h2>Type a URL (https://...) or a Search Query</h2>
    <input type="text" id="input" onkeypress="handleKeyPress(event)" placeholder="Enter URL or search..." />
    <button onclick="redirect()">Go</button>
</body>

</html>
